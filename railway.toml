# Configuration Railway pour l'alpha Bookfin — API Axum uniquement.
#
# Périmètre volontairement restreint : seul le backend REST (/api/v1/*, /health)
# est servi. Le pipeline cargo-leptos (UI web, assets /pkg/*) n'est pas construit
# ici et reste un sujet local/debug séparé.
#
# Aucun secret dans ce fichier : DATABASE_URL, PORT, etc. doivent être définis
# comme variables d'environnement dans le dashboard Railway.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
# The three maintenance binaries are packaged but never started automatically.
# They are available only for an explicitly authorised, SSH-invoked Curated V1
# audit/import operation; the deployed process remains `bookfin` below.
# Nixpacks/Railpack's auto-detected Rust build only ever copied the single
# binary it inferred from Cargo.toml into the final image, silently ignoring
# buildCommand for the actual compile/copy step (confirmed by `railway ssh`
# inspection on 2026-09-16/17 — the extra --bin targets never reached the
# deployed container even after changing buildCommand, and the layer was
# reused unchanged across redeploys). The explicit Dockerfile takes over
# packaging instead.

[deploy]
startCommand = "/usr/local/bin/bookfin"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
