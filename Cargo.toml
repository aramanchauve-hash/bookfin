[package]
name = "bookfin"
version = "0.1.0"
edition = "2021"
default-run = "bookfin"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "bookfin"
path = "src/main.rs"
required-features = ["ssr"]

[[bin]]
name = "seed"
path = "src/bin/seed.rs"
required-features = ["ssr"]

[[bin]]
name = "simulate_overlap"
path = "src/bin/simulate_overlap.rs"
required-features = ["ssr"]

[[bin]]
name = "ingest_pilot_corpus"
path = "src/bin/ingest_pilot_corpus.rs"
required-features = ["ssr"]

[[bin]]
name = "ingest_long_form_corpus"
path = "src/bin/ingest_long_form_corpus.rs"
required-features = ["ssr"]

[[bin]]
name = "alpha_invite"
path = "src/bin/alpha_invite.rs"
required-features = ["ssr"]

[[bin]]
name = "alpha_report"
path = "src/bin/alpha_report.rs"
required-features = ["ssr"]

[dependencies]
leptos = { version = "0.7.8" }
leptos_meta = { version = "0.7.8" }
leptos_router = { version = "0.7.8" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.12", features = ["v4", "v5", "serde", "js"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
http = "1.2"
tracing = "0.1"

# Client hydration dependencies
wasm-bindgen = { version = "0.2", optional = true }

# Server dependencies
leptos_axum = { version = "0.7.8", optional = true }
axum = { version = "0.7.9", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", features = ["fs", "cors"], optional = true }
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres", "uuid", "chrono", "macros", "migrate"], optional = true }
dotenvy = { version = "0.15", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
rand = { version = "0.8", optional = true }
sha2 = { version = "0.10", optional = true }

[features]
default = ["ssr"]
csr = ["leptos/csr"]
hydrate = [
    "leptos/hydrate",
    "dep:wasm-bindgen",
]
ssr = [
    "dep:axum",
    "dep:tokio",
    "dep:tower",
    "dep:tower-http",
    "dep:leptos_axum",
    "dep:sqlx",
    "dep:dotenvy",
    "dep:tracing-subscriber",
    "dep:rand",
    "dep:sha2",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
]

[[bin]]
name = "benchmark_volume"
path = "src/bin/benchmark_volume.rs"
required-features = ["ssr"]

[package.metadata.leptos]
output-name = "bookfin"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "style/main.css"
assets-dir = "public"
site-addr = "127.0.0.1:3000"
reload-port = 3001
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
